<style>
/* Layout: single centred column, like a scoresheet header; checkered rule as the one motif */
:root{
  --bg:#eef0ec; --surface:#ffffff; --ink:#1b2420; --muted:#5d6a63;
  --line:#cfd6d0; --accent:#1f6b4f; --accent-ink:#ffffff; --err:#b3261e; --good:#1f6b4f; --bad:#b3261e;
  --pw-bg:#fbfbf7; --pw-fg:#141414; --pb-bg:#161616; --pb-fg:#f6f6f2; --draw:#9aa5a0; --sqdark:#c9d6cf; --byebg:#f1f3f1; --byetag:#e2e6e3; --chip:#e4ebe6;
  --display:"Syne","Trebuchet MS",sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1a221e; --ink:#e7ece8; --muted:#9aa8a0;
  --line:#2f3b35; --accent:#5fbf93; --accent-ink:#0d1411; --err:#f2a49c; --good:#5fbf93; --bad:#f2a49c;
  --pb-bg:#050505; --draw:#6b7872; --sqdark:#223129; --byebg:#1e2622; --byetag:#2a3530; --chip:#26322c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --ink:#e7ece8; --muted:#9aa8a0;
  --line:#2f3b35; --accent:#5fbf93; --accent-ink:#0d1411; --err:#f2a49c; --good:#5fbf93; --bad:#f2a49c;
  --pb-bg:#050505; --draw:#6b7872; --sqdark:#223129; --byebg:#1e2622; --byetag:#2a3530; --chip:#26322c; color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:520px;margin:0 auto}
.view{display:flex;flex-direction:column;gap:24px}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);margin-left:auto}
.lang button{font:600 13px/1 var(--mono);letter-spacing:.06em;border:0;background:none;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.back{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0}
.back:hover{border-color:var(--accent);color:var(--accent)}
.back svg{width:22px;height:22px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.homebtn{margin-left:auto;width:42px;height:42px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.homebtn:hover{border-color:var(--accent);color:var(--accent)}
.homebtn svg{width:22px;height:22px}

header.brand{display:flex;flex-direction:column;gap:6px}
.checker{height:12px;width:96px;background:repeating-linear-gradient(90deg,var(--accent) 0 12px,var(--sqdark) 12px 24px)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(48px,14vw,72px);line-height:.95;letter-spacing:-.02em;margin:10px 0 0}
h2.title{font-family:var(--display);font-weight:700;font-size:clamp(28px,8vw,40px);line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.sub{font-family:var(--mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0}
.lede{color:var(--muted);margin:8px 0 0;max-width:40ch}

.status{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:1fr 1fr 0.8fr}
.status>div{padding:14px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.status>div+div{border-left:1px solid var(--line)}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.val{font-family:var(--mono);font-weight:600;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.2}
.val.empty{color:var(--muted);font-size:18px;padding-top:6px}
.delta{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}

.menu{display:flex;flex-direction:column;gap:12px}
.primary{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border-radius:10px;padding:18px 22px;cursor:pointer;
  font:600 19px/1.2 var(--body);text-align:left;transition:transform .12s ease,filter .12s ease;border:1px solid transparent}
.primary.fill{background:var(--accent);color:var(--accent-ink)}
.primary.outline{background:var(--surface);color:var(--ink);border-color:var(--line)}
.primary:hover{filter:brightness(1.06)}
.primary:active{transform:translateY(1px)}
.primary small{display:block;font-weight:400;font-size:13px;opacity:.8;margin-top:3px}
.primary .arrow{font-family:var(--mono);font-size:22px}
button:focus-visible,input:focus-visible,select:focus-visible,.tcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 18px;display:flex;flex-direction:column;gap:18px}
.panel h3{font-family:var(--display);font-weight:600;font-size:22px;margin:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:14px;font-weight:500}
.opt{color:var(--muted);font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--muted)}
input,select{font:500 17px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%;box-sizing:border-box;min-width:0}
input.name{font-family:var(--body)}
.err{color:var(--err);font-size:13px;min-height:1em;margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:600 15px var(--body);border-radius:8px;padding:12px 18px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--ink)}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1}
.btn.danger{color:var(--bad);border-color:var(--bad)}
#modAsk{align-self:flex-start}
.toast{font-size:14px;color:var(--accent);font-weight:500;min-height:1.4em;margin:-12px 0 0}

/* tournaments list */
.tlist{display:flex;flex-direction:column;gap:10px}
.tcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;text-align:left;width:100%;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--ink);font:inherit}
.tcard:hover{border-color:var(--accent)}
.tmain{display:flex;flex-direction:column;gap:6px;min-width:0}
.tcard .tn{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.twhen{font-size:15px;color:var(--muted);line-height:1.35}
.tchips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px/1 var(--body);padding:6px 10px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.chip.live{background:var(--accent);color:var(--accent-ink)}
.chip.muted{background:transparent;border:1px solid var(--line);color:var(--muted);padding:5px 9px}
.chip.warn{color:var(--bad)}
.tcard .tp{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tcard .tp b{font:600 26px/1.1 var(--mono);font-variant-numeric:tabular-nums}

function chartCard(title,lg){const c=mk("section","card"),h=mk("div","chead");h.append(mk("h3",null,title));if(lg)h.append(lg);
  const ch=mk("div","chart"),inf=mk("p","cinfo");inf.setAttribute("aria-live","polite");c.append(h,ch,inf);return{card:c,box:ch,info:inf}}
const dLabel=tr=>{const dt=tr.start||tr.end;return dt?dt.slice(5,7)+"/"+dt.slice(2,4):"·"};
function infoHead(info,tr){info.replaceChildren();info.append(mk("strong",null,tr.name),document.createElement("br"));const dl=dateRange(tr);if(dl)info.append(dl+" · ")}

/* generic line chart: one y-scale, several series sharing it */
function lineChart(box,info,items,series,infoFn){
  box.replaceChildren();
  const W=Math.max(280,box.clientWidth||340),H=230,m={l:42,r:18,t:18,b:26};
  const vals=items.flatMap(it=>series.map(se=>it[se.key])).filter(v=>v!=null);
  let lo=Math.floor((Math.min(...vals)-40)/100)*100,hi=Math.ceil((Math.max(...vals)+40)/100)*100;
  const step=(hi-lo)/100>6?200:100;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const n=items.length,iw=W-m.l-m.r,ih=H-m.t-m.b;
  const x=i=>n===1?m.l+iw/2:m.l+i*iw/(n-1),y=v=>m.t+ih*(1-(v-lo)/(hi-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let v=lo;v<=hi;v+=step)s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const every=Math.max(1,Math.ceil(n/(W<460?5:9)));
  items.forEach((it,i)=>{if((n-1-i)%every)return;s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${dLabel(it.tr)}</text>`});
  s+=`<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" stroke="var(--muted)" visibility="hidden"/>`;
  series.forEach(se=>{const pts=items.map((it,i)=>it[se.key]!=null?[x(i),y(it[se.key])]:null).filter(Boolean);
    if(se.line&&pts.length>1)s+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--${se.c})" stroke-width="${se.w||2.5}" stroke-linejoin="round"${se.dash?' stroke-dasharray="5 4"':""}/>`;
    if(se.dots)pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${se.r||4.5}" fill="var(--${se.c})" stroke="var(--surface)" stroke-width="2"/>`})});
  const last=items[n-1],ls=series.find(se=>se.label&&last[se.key]!=null);
  if(ls)s+=`<text class="vlab" x="${x(n-1)}" y="${y(last[ls.key])-10}" text-anchor="${n>1?"end":"middle"}">${Math.round(last[ls.key])}</text>`;
  const hw=n===1?iw:iw/(n-1);
  items.forEach((it,i)=>{s+=`<rect class="hit" data-i="${i}" tabindex="0" x="${Math.max(0,x(i)-hw/2)}" y="0" width="${hw}" height="${H}"/>`});
  box.innerHTML=s+"</svg>";
  const pick=i=>{const xh=box.querySelector(".xh");xh.setAttribute("x1",x(i));xh.setAttribute("x2",x(i));xh.setAttribute("visibility","visible");infoFn(items[i],info)};
  box.querySelectorAll(".hit").forEach(r=>{const i=+r.dataset.i;["mouseenter","click","focus"].forEach(ev=>r.addEventListener(ev,()=>pick(i)))});
  pick(n-1);
}

/* performance chart with Elo-gain strip */
function drawChart(box,infoEl){
  box.replaceChildren();infoEl.textContent="";
  const data=statList.map(tr=>{const st=stats(tr);return{tr,perf:st.perf,n:st.n,g:eloGain(tr)}}).filter(d=>d.perf!=null).sort((a,b)=>chrono(a.tr,b.tr)).slice(-10);
  if(!data.length){box.append(mk("p","hint",t("noChart")));box.style.minHeight="0";return}
  const W=Math.max(280,box.clientWidth||340),PH=206,SH=84,H=PH+SH+22,m={l:42,r:18,t:18};
  const vals=data.flatMap(d=>[d.perf,d.tr.myElo]).filter(Boolean);
  let lo=Math.floor((Math.min(...vals)-40)/100)*100,hi=Math.ceil((Math.max(...vals)+40)/100)*100;
  const step=(hi-lo)/100>6?200:100;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const n=data.length,iw=W-m.l-m.r,ih=PH-m.t;
  const x=i=>n===1?m.l+iw/2:m.l+i*iw/(n-1),y=v=>m.t+ih*(1-(v-lo)/(hi-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("chartTitle")}">`;
  for(let v=lo;v<=hi;v+=step){s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`}
  const z=PH+SH/2+2,half=SH/2-16,maxG=Math.max(5,...data.map(d=>d.g?Math.abs(d.g.d):0));
  const bw=Math.min(18,Math.max(8,(n>1?iw/(n-1):iw)*.42));
  s+=`<text x="${m.l-8}" y="${z+4}" text-anchor="end">±Elo</text><line x1="${m.l}" x2="${W-m.r}" y1="${z}" y2="${z}" stroke="var(--line)" stroke-width="1"/>`;
  const every=W<460&&n>6?2:1;
  data.forEach((d,i)=>{
    const show=!((n-1-i)%every);
    if(d.g){const h=Math.max(2,half*Math.abs(d.g.d)/maxG),up=d.g.d>=0,yy=up?z-h:z;
      s+=`<rect x="${x(i)-bw/2}" y="${yy}" width="${bw}" height="${h}" rx="3" fill="var(--${up?"good":"bad"})"/>`;
      if(show)s+=`<text class="glab" x="${x(i)}" y="${up?z-h-5:z+h+12}" text-anchor="middle">${fmtGain(Math.round(d.g.d))}</text>`;}
    else s+=`<text x="${x(i)}" y="${z+4}" text-anchor="middle">–</text>`;
    if(show)s+=`<text x="${x(i)}" y="${H-4}" text-anchor="middle">${dLabel(d.tr)}</text>`;
  });
  s+=`<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${PH+SH}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
  const myPts=data.map((d,i)=>d.tr.myElo?[x(i),y(d.tr.myElo)]:null).filter(Boolean);
  if(myPts.length>1)s+=`<polyline points="${myPts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>`;
  s+=`<polyline points="${data.map((d,i)=>x(i)+","+y(d.perf)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  data.forEach((d,i)=>{const few=d.n<MIN_PERF;s+=`<circle class="pt" cx="${x(i)}" cy="${y(d.perf)}" r="4.5" fill="var(--${few?"surface":"accent"})" stroke="var(--${few?"accent":"surface"})" stroke-width="2"/>`});
  const L=n-1;s+=`<text class="vlab" x="${x(L)}" y="${y(data[L].perf)-10}" text-anchor="${n>1?"end":"middle"}">${perfTxt(data[L].perf,data[L].n)}</text>`;
  const hw=n===1?iw:iw/(n-1);
  data.forEach((d,i)=>{s+=`<rect class="hit" data-i="${i}" tabindex="0" x="${Math.max(0,x(i)-hw/2)}" y="0" width="${hw}" height="${H}"/>`});
  box.innerHTML=s+"</svg>";
  const pick=i=>{const d=data[i],xh=box.querySelector(".xh");
    xh.setAttribute("x1",x(i));xh.setAttribute("x2",x(i));xh.setAttribute("visibility","visible");
    box.querySelectorAll("circle.pt").forEach((c,j)=>c.setAttribute("r",j===i?6.5:4.5));
    infoHead(infoEl,d.tr);
    infoEl.append(t("perf")+" ",mk("b",null,perfTxt(d.perf,d.n)));if(d.n<MIN_PERF)infoEl.append(" ("+t("perfFew")+")");
    if(d.tr.myElo){const diff=d.perf-d.tr.myElo;infoEl.append(" · "+t("infoMy")+" ",mk("b",null,String(d.tr.myElo))," ("+fmtSigned(diff)+")")}
    infoEl.append(document.createElement("br"));
    if(d.g){const gb=mk("b",d.g.d>=0?"up":"down",fmtGain(d.g.d));gb.style.color=`var(--${d.g.d>=0?"good":"bad"})`;infoEl.append(t("lgGain")+" ",gb," (K"+d.g.k+")")}
    else infoEl.append(t("lgGain")+" ",d.tr.valid==="none"?t("unrated"):"—");
    chartSel=i;};
  box.querySelectorAll(".hit").forEach(r=>{const i=+r.dataset.i;["mouseenter","click","focus"].forEach(ev=>r.addEventListener(ev,()=>pick(i)))});
  pick(chartSel!=null&&chartSel<n?chartSel:n-1);
}

  rounds(body,games){
    const th=[[],[],[]];games.forEach(g=>th[Math.min(2,Math.floor(3*g.i/g.tr.rounds.length))].push(g));
    const avgGap=gs=>{const m=gs.filter(g=>g.my);return m.length?Math.round(m.reduce((a,g)=>a+g.opp-g.my,0)/m.length):null};

  },
  records(body,games){
    const list=mk("div","recs");
    const add=(ic,title,val,detail)=>{const c=mk("div","rec"),i=mk("span","sic");i.innerHTML=icon(ic);const tx=mk("div","rtx");
      tx.append(mk("span","lbl",title),mk("span","rv",val),mk("span","rd",detail));c.append(i,tx);list.append(c)};
    const where=tr=>[tr.name,dateRange(tr)].filter(Boolean).join(" · ");
    const tp=statList.map(tr=>{const st=stats(tr);return{tr,p:st.perf,n:st.n}}).filter(x=>x.p!=null&&x.n>=MIN_PERF);
    if(tp.length){const b=tp.reduce((a,x)=>x.p>a.p?x:a);add("records",t("recPerf"),String(b.p),where(b.tr))}
    const tg=statList.map(tr=>({tr,g:eloGain(tr)})).filter(x=>x.g);
    if(tg.length){const b=tg.reduce((a,x)=>x.g.d>a.g.d?x:a);if(b.g.d>0)add("up",t("recGain"),fmtGain(b.g.d),where(b.tr))}
    const wins=games.filter(g=>g.s===1);
    if(wins.length){const b=wins.reduce((a,g)=>g.opp>a.opp?g:a);add("crown",t("recWin"),String(b.opp),[b.my&&T[lang].diffTxt(b.opp-b.my),b.tr.name+" · R"+(b.i+1)].filter(Boolean).join(" · "))}
    const streak=f=>{let best={len:0},cur=0,st=0;games.forEach((g,i)=>{if(f(g.s)){if(!cur)st=i;cur++;if(cur>best.len)best={len:cur,a:games[st],b:g}}else cur=0});return best};
    const span=s=>s.a.tr===s.b.tr?`${s.a.tr.name} · R${s.a.i+1}–R${s.b.i+1}`:`${s.a.tr.name} R${s.a.i+1} → ${s.b.tr.name} R${s.b.i+1}`;
    const un=streak(s=>s>0);if(un.len)add("flame",t("recUnbeaten"),T[lang].games(un.len),span(un));
    const wn=streak(s=>s===1);if(wn.len)add("bolt",t("recWins"),T[lang].games(wn.len),span(wn));

  curious(body,games){

    // Elo swing of one game, at the Elo frozen in its tournament (null if the tournament isn't rated)

    const mini=(tx,arr)=>{const ul=mk("ul","minilist");arr.slice(0,3).forEach(g=>{const w=swing(g);

    // 1. Elo defeated

    const ups=games.filter(g=>g.my&&g.s===1&&g.opp-g.my>=200).sort((a,b)=>(b.opp-b.my)-(a.opp-a.my));
    const upE=ups.map(swing).filter(v=>v!=null).reduce((a,v)=>a+v,0);

    const gE=gifts.map(swing).filter(v=>v!=null).reduce((a,v)=>a+v,0);

    const byR={};games.forEach(g=>{(byR[g.i]=byR[g.i]||[]).push(g)});
    let rs=Object.entries(byR).map(([i,gs])=>({r:+i+1,n:gs.length,p:Math.round(100*gs.reduce((a,g)=>a+g.s,0)/gs.length)}));
    const solid=rs.filter(x=>x.n>=3);if(solid.length>=2)rs=solid;
    const t4=card("horseshoe",t("cuRound"),"",null);t4.querySelector(".rv").remove();

/* ---------- backup: export / import ---------- */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
const RES_OK=new Set(["","10","hh","01","+-","-+","--"]),VALID_OK=new Set(["fide","nat","both","none"]);
function exportData(){return JSON.stringify({app:"arpad",format:1,exported:new Date().toISOString(),player,tours},null,1)}
const isNum=v=>typeof v==="number"&&isFinite(v);
function cleanTour(x){
  if(!x||typeof x!=="object"||typeof x.name!=="string"||!Array.isArray(x.rounds)||!x.rounds.length||x.rounds.length>30)return null;
  const str=(v,n)=>typeof v==="string"?v.slice(0,n):"",date=v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v)?v:"";
  const tr={id:typeof x.id==="string"&&x.id?x.id.slice(0,40):Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    name:str(x.name,80).trim()||"—",place:str(x.place,80),start:date(x.start),end:date(x.end),
    valid:VALID_OK.has(x.valid)?x.valid:"",myElo:isNum(x.myElo)?Math.round(x.myElo):null,myEloNat:isNum(x.myEloNat)?Math.round(x.myEloNat):null,
    k:isNum(x.k)&&x.k>0?x.k:null,kNat:isNum(x.kNat)&&x.kNat>0?x.kNat:null,created:typeof x.created==="string"?x.created.slice(0,40):new Date().toISOString(),
    rounds:x.rounds.map(r=>({color:r&&(r.color==="w"||r.color==="b")?r.color:"",opp:r&&/^\d{0,4}$/.test(String(r.opp??""))?String(r.opp??""):"",res:r&&RES_OK.has(r.res)?r.res:""}))};
  if(x.tc&&Number.isInteger(x.tc.min)&&Number.isInteger(x.tc.inc))tr.tc={min:x.tc.min,inc:x.tc.inc};
  if(x.demo===true)tr.demo=true;return tr}
function parseBackup(text){let o;try{o=JSON.parse(text)}catch(e){return null}
  if(!o||o.app!=="arpad"||!Array.isArray(o.tours))return null;
  const ts=o.tours.map(cleanTour).filter(Boolean);
  let p=null;const q=o.player;if(q&&typeof q==="object")p={name:typeof q.name==="string"?q.name.slice(0,60):"",fide:isNum(q.fide)?Math.round(q.fide):null,nat:isNum(q.nat)?Math.round(q.nat):null,k:isNum(q.k)&&q.k>0?q.k:null,natSys:q.natSys==="fide"?"fide":"fce"};
  return{tours:ts,player:p,exported:typeof o.exported==="string"?o.exported:""}}
let pendingImport=null;
function renderBackup(){const last=store.get("arpad.lastBackup");
  $("bkLast").textContent=last?T[lang].bkLastAt(new Date(last).toLocaleDateString(T[lang].locale,{day:"numeric",month:"long",year:"numeric"})):t("bkNever");
  $("bkSummary").textContent=T[lang].bkHave(tours.length);$("bkStatus").textContent="";$("bkImpBox").hidden=true;$("bkPaste").value="";pendingImport=null}
$("bkExport").addEventListener("click",async()=>{const st=$("bkStatus"),data=exportData(),name="arpad-copia-"+new Date().toISOString().slice(0,10)+".json";
  const done=()=>{store.set("arpad.lastBackup",new Date().toISOString());renderBackup();$("bkStatus").textContent=t("bkSaved")};
  if(dlCap===undefined){try{dlCap=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){dlCap=null}}
  if(dlCap){try{await dlCap.save({filename:name,data});done()}catch(e){st.textContent=e&&e.code==="declined"?"":t("bkSaveFail")}return}
  try{const u=URL.createObjectURL(new Blob([data],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);done()}
  catch(e){st.textContent=t("bkSaveFail")}});
$("bkCopy").addEventListener("click",()=>{const data=exportData();
  try{navigator.clipboard.writeText(data).then(()=>{store.set("arpad.lastBackup",new Date().toISOString());renderBackup();$("bkStatus").textContent=t("bkCopied")},()=>{$("bkStatus").textContent=t("bkCopyFail")})}
  catch(e){$("bkStatus").textContent=t("bkCopyFail")}});
function stageImport(text){const r=parseBackup(text),st=$("bkStatus");
  if(!r){pendingImport=null;$("bkImpBox").hidden=true;st.textContent=t("bkBad");return}
  pendingImport=r;const dt=r.exported?new Date(r.exported).toLocaleDateString(T[lang].locale,{day:"numeric",month:"short",year:"numeric"}):"";
  $("bkImpText").textContent=T[lang].bkFound(r.tours.length,r.player&&r.player.name,dt);$("bkImpBox").hidden=false;st.textContent=""}
$("bkFile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
  if(f.size>5e6){$("bkStatus").textContent=t("bkBad");return}
  const rd=new FileReader();rd.onload=()=>stageImport(String(rd.result));rd.onerror=()=>{$("bkStatus").textContent=t("bkBad")};rd.readAsText(f);e.target.value=""});
$("bkPasteBtn").addEventListener("click",()=>{const v=$("bkPaste").value.trim();if(v)stageImport(v);else $("bkPaste").focus()});
function applyImport(mode){if(!pendingImport)return;const r=pendingImport;let added=0;
  if(mode==="replace"){tours=r.tours;added=r.tours.length;if(r.player)player=r.player}
  else{const ids=new Set(tours.map(x=>x.id));r.tours.forEach(x=>{if(!ids.has(x.id)){tours.push(x);added++}});if(!player&&r.player)player=r.player}
  saveTours();if(player)store.set("arpad.player",JSON.stringify(player));store.set("arpad.demo1","1");
  renderBackup();renderHome();$("bkStatus").textContent=mode==="replace"?T[lang].bkRestored(added):T[lang].bkDone(added)}
$("bkMerge").addEventListener("click",()=>applyImport("merge"));
$("bkReplace").addEventListener("click",()=>{$("bkReplaceConfirm").hidden=false});
$("bkReplaceNo").addEventListener("click",()=>{$("bkReplaceConfirm").hidden=true});
$("bkReplaceYes").addEventListener("click",()=>{$("bkReplaceConfirm").hidden=true;applyImport("replace")});

renderStatic();renderHome();
</script>

<script>
if("serviceWorker" in navigator&&window.isSecureContext){addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
